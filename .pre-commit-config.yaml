# ruff hook revs must stay in lockstep with the ruff version in the dev
# dependency group (currently 0.16.7). Run `pre-commit autoupdate` after
# bumping ruff in pyproject.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^configs/data\.json$ # empty placeholder, not valid JSON yet
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
