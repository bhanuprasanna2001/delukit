[project]
name = "delu"
version = "0.1.0"
description = "DELU display and forecast API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openpyxl>=3.1.5",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 88
required-version = "0.16.8"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
