version: 2
updates:
  # Update each independently locked dependency project, plus shared CI hooks.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /delu
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /delu/frontend
    schedule:
      interval: monthly
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
