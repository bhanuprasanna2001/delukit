# Quality gate. Only `all-checks-passed` is required in branch rules.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Local and CI checks share scripts/verify. Keep the matrix groups independent
  # so failures remain visible while every group runs.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [hygiene, python-root, python-delu, frontend, docker-root, docker-delu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: ${{ matrix.group == 'hygiene' || startsWith(matrix.group, 'python-') }}
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.group == 'frontend' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: delu/frontend/package-lock.json
      - run: scripts/verify --group "${{ matrix.group }}"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      # Require only this stable status in branch protection; matrix job names can
      # change as the verification groups evolve.
      - name: Require every verification group to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "::error::Verification failed, was cancelled, or was skipped: $VERIFY_RESULT"
            exit 1
          fi
          echo "All checks passed."
