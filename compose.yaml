services:
  delukit:
    build: .
    image: delukit:local
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
      DAGSTER_HOME: /app/data/.dagster
      DELUKIT_ALERT_WEBHOOK: ${DELUKIT_ALERT_WEBHOOK:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  delu:
    build: ./delu
    image: delu:local
    init: true
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Berlin
      DELU_FORECASTS: /data/forecasts
      DELU_ACTUALS: /data/clean
      DELU_DB: /app/data/app.db
      DELU_PUBLIC_URL: ${DELU_PUBLIC_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-delu@localhost}
    volumes:
      - ./data:/data:ro
      - ./delu/data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
