[project]
name = "delukit"
version = "0.1.0"
description = "Energy forecasting."
readme = "README.md"
authors = [
    { name = "Bhanu Prasanna", email = "bhanu.prasanna2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.23",
    "dagster-webserver>=1.13.23",
    "openstef>=4.4.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
delukit = "delukit.sources.sync:main"
delukit-clean = "delukit.data.clean:main"
delukit-dataset = "delukit.data.dataset:main"
delukit-forecast = "delukit.models.forecast:main"
delukit-backtest = "delukit.evaluation.backtest:main"
delukit-tune = "delukit.models.tune:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.pyright]
include = ["src", "scripts/verify.py"]
strict = ["scripts/verify.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 88
required-version = "0.16.8"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["delukit"]

[tool.ruff.lint.per-file-ignores]
"src/delukit/core/config/__init__.py" = ["E402"]
