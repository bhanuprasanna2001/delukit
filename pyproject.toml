[project]
name = "delukit"
version = "0.1.0"
description = "Energy forecasting."
readme = "README.md"
authors = [
    { name = "Bhanu Prasanna", email = "bhanu.prasanna2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.23",
    "dagster-webserver>=1.13.23",
    "openstef>=4.4.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
delukit = "delukit.main:main"
delukit-clean = "delukit.clean:main"
delukit-dataset = "delukit.dataset:main"
delukit-forecast = "delukit.forecast:main"
delukit-backtest = "delukit.backtest:main"
delukit-tune = "delukit.tune:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
