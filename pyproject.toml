[project]
name = "delukit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhanu Prasanna", email = "bhanu.prasanna2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "entsoe-py>=0.8.1",
    "pyrate-limiter>=4.5.0",
]

[project.scripts]
delukit = "delukit:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
